<header class="bg-slate-900 border-b border-slate-800 shadow-md h-16 sticky top-0 z-50">
  <div class="h-full px-6 flex items-center justify-between">
    
    <!-- Logo y Título -->
    <a routerLink="/" class="flex items-center space-x-3 group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20 group-hover:scale-105 transition-transform">
        <i class="pi pi-coffee text-lg"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-base sm:text-lg font-bold text-white tracking-tight">
          Taza<span class="text-amber-500">Norte</span>
        </span>
        <span class="text-slate-500 hidden sm:inline">·</span>
        <span class="text-xs sm:text-sm text-slate-300 font-medium hidden sm:inline">
          Producción y venta de cafetería
        </span>
      </div>
    </a>

    <!-- Zona Derecha: Estado de Backend y Usuario Autenticado -->
    <div class="flex items-center space-x-4">
      
      <!-- Estado del Backend -->
      <div class="hidden sm:flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700/60 shadow-inner">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs text-slate-300 font-mono">Django API :8000</span>
      </div>

      <!-- Control de Sesión -->
      @if (authService.isAuthenticated()) {
        <div class="flex items-center gap-2">
          <a routerLink="/perfil" 
             class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700 text-xs text-slate-200 transition-colors">
            <span class="w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
              <i class="pi pi-user text-xs"></i>
            </span>
            <span class="font-semibold">{{ authService.currentUser()?.username || 'admin' }}</span>
          </a>
          <button (click)="authService.logout()" 
                  title="Cerrar Sesión"
                  class="w-8 h-8 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 flex items-center justify-center transition-colors">
            <i class="pi pi-power-off text-xs"></i>
          </button>
        </div>
      } @else {
        <a routerLink="/login" 
           class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs shadow-md shadow-amber-500/20 transition-all">
          <i class="pi pi-sign-in text-xs"></i>
          <span>Iniciar Sesión</span>
        </a>
      }

    </div>

  </div>
</header>

<header class="bg-white/95 backdrop-blur-md border-b border-amber-200/70 shadow-sm h-16 sticky top-0 z-50 transition-colors">
  <div class="h-full px-6 flex items-center justify-between">
    
    <!-- Logo y Título -->
    <a routerLink="/" class="flex items-center space-x-3 group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20 group-hover:scale-105 transition-transform">
        <i class="pi pi-coffee text-lg text-stone-950"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-base sm:text-lg font-bold text-stone-900 tracking-tight">
          Taza<span class="text-amber-500">Norte</span>
        </span>
        <span class="text-stone-300 hidden sm:inline">·</span>
        <span class="text-xs sm:text-sm text-stone-600 font-medium hidden sm:inline">
          Producción y venta de cafetería
        </span>
      </div>
    </a>

    <!-- Zona Derecha: Estado de Backend y Usuario Autenticado -->
    <div class="flex items-center space-x-4">
      
      <!-- Estado del Backend -->
      <div class="hidden sm:flex items-center space-x-2 bg-amber-50/80 px-3 py-1.5 rounded-full border border-amber-200 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs text-stone-700 font-mono font-medium">Django API :8000</span>
      </div>

      <!-- Control de Sesión -->
      @if (authService.isAuthenticated()) {
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-stone-800 shadow-sm">
            <span class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-600 to-amber-500 text-stone-950 font-black text-xs flex items-center justify-center shadow-sm">
              {{ (authService.currentUser()?.username || 'admin').slice(0, 2).toUpperCase() }}
            </span>
            <div class="flex flex-col text-left">
              <span class="font-bold text-stone-900 leading-tight">{{ authService.currentUser()?.username || 'admin' }}</span>
              <span class="text-[10px] text-amber-700 font-semibold leading-tight">Administrador</span>
            </div>
          </div>
          <button (click)="authService.logout()" 
                  title="Cerrar Sesión"
                  class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 flex items-center justify-center transition-colors shadow-sm">
            <i class="pi pi-power-off text-xs"></i>
          </button>
        </div>
      } @else if (!isLogin()) {
        <a routerLink="/login" 
           class="flex items-center gap-2 px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold text-xs shadow-md shadow-amber-500/20 transition-all hover:scale-105">
          <i class="pi pi-sign-in text-xs"></i>
          <span>Iniciar Sesión</span>
        </a>
      }

    </div>

  </div>
</header>

<header class="bg-slate-900 border-b border-slate-800 shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo y Marca -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-amber-500/20">
          <i class="pi pi-coffee text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-white flex items-center gap-1.5">
            Taza<span class="text-amber-500">Norte</span>
          </span>
          <span class="text-[10px] tracking-wider text-slate-400 block -mt-1 font-medium uppercase">
            Sistema Cafetería · Frontend 2026
          </span>
        </div>
      </div>

      <!-- Enlaces Principales -->
      <nav class="hidden md:flex items-center space-x-1">
        <a routerLink="/clientes" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30"
           class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent transition-all flex items-center gap-2">
          <i class="pi pi-users text-sm"></i>
          <span>Clientes</span>
        </a>

        <a routerLink="/tipos-producto" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30"
           class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent transition-all flex items-center gap-2">
          <i class="pi pi-tags text-sm"></i>
          <span>Tipos</span>
        </a>

        <a routerLink="/productos" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30"
           class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent transition-all flex items-center gap-2">
          <i class="pi pi-box text-sm"></i>
          <span>Productos</span>
        </a>

        <a routerLink="/ventas" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30"
           class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent transition-all flex items-center gap-2">
          <i class="pi pi-receipt text-sm"></i>
          <span>Ventas</span>
        </a>

        <a routerLink="/ventas/nueva" 
           routerLinkActive="bg-amber-600 text-white"
           class="ml-2 px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold shadow-md shadow-amber-500/20 transition-all flex items-center gap-2">
          <i class="pi pi-cart-plus text-sm"></i>
          <span>Nueva Venta</span>
        </a>
      </nav>

      <!-- Estado del Backend -->
      <div class="hidden sm:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/60">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs text-slate-300 font-mono">Django API :8000</span>
      </div>

    </div>
  </div>
</header>

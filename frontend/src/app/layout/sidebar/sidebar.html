<aside class="w-64 shrink-0 bg-[#121110] border-r border-[#262320] flex flex-col min-h-full select-none text-stone-200">
  
  <!-- Logo de TazaNorte en el Sidebar -->
  <div class="p-5 border-b border-[#262320]">
    <a routerLink="/" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-amber-400 flex items-center justify-center text-stone-950 shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
        <i class="pi pi-coffee text-xl font-bold"></i>
      </div>
      <div>
        <div class="text-base font-extrabold text-white tracking-tight leading-tight">
          Taza<span class="text-amber-500">Norte</span>
        </div>
        <p class="text-[9px] uppercase font-bold tracking-widest text-amber-500/90 font-mono mt-0.5">
          Cafetería Gourmet
        </p>
      </div>
    </a>
  </div>

  <!-- Contenedor con Scroll de las Secciones -->
  <div class="flex-1 py-4 px-3 space-y-6 overflow-y-auto">
    
    @for (section of sections; track section.id) {
      @if (canViewSection(section)) {
      <div class="space-y-1.5">
        
        <!-- Cabecera de Categoría Plegable -->
        <button (click)="toggleSection(section.id)" 
                class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] font-bold text-stone-400 hover:text-stone-200 uppercase tracking-widest transition-colors">
          <i [class]="isExpanded(section.id) ? 'pi pi-chevron-down text-stone-500' : 'pi pi-chevron-right text-stone-600'" 
             class="text-[9px] transition-transform duration-200"></i>
          <span>{{ section.label }}</span>
        </button>

        <!-- Lista de Enlaces -->
        @if (isExpanded(section.id)) {
          <div class="space-y-1 pl-1">
            @for (sub of section.children; track sub.route) {
              <a [routerLink]="sub.route" 
                 [routerLinkActiveOptions]="{ exact: !!sub.exact }"
                 routerLinkActive="active-nav-item"
                 class="nav-item group flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-stone-300 hover:text-white hover:bg-[#201c18] text-sm font-medium transition-all">
                <i [class]="sub.icon" class="nav-icon text-sm text-stone-400 group-hover:text-amber-400 transition-colors"></i>
                <span class="truncate">{{ sub.label }}</span>
              </a>
            }
          </div>
        }

      </div>
      }
    }

  </div>

  <!-- Pie de la Barra Lateral -->
  <div class="p-3 border-t border-[#262320] text-center">
    <p class="text-[10px] text-stone-400 font-mono">
      Producción y venta de cafetería
    </p>
  </div>

</aside>

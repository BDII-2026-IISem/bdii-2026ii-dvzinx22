<div class="fixed inset-0 z-[9999] flex flex-col items-center justify-center p-6 bg-gradient-to-br from-[#FFFDF8] via-[#FAF6EE] to-[#F5ECE0] transition-opacity duration-700"
     [class.opacity-0]="fadingOut()"
     [class.pointer-events-none]="fadingOut()">

  <!-- Botón Saltar Arriba Derecha -->
  <button (click)="finish()"
          class="absolute top-6 right-6 px-4 py-2 rounded-full border border-amber-300/80 bg-white/80 hover:bg-white text-xs font-semibold text-amber-900 shadow-sm transition-all hover:scale-105">
    Saltar intro &rarr;
  </button>

  <div class="max-w-md w-full flex flex-col items-center text-center space-y-6">

    <!-- Animación de Taza de Café con Vapor -->
    <div class="relative w-36 h-36 flex items-center justify-center">
      <!-- Aura dorada pulsante de fondo -->
      <div class="absolute inset-0 rounded-full bg-amber-400/20 blur-2xl animate-pulse"></div>

      <!-- Partículas de Vapor -->
      <div class="absolute -top-6 flex justify-center space-x-3 pointer-events-none">
        <span class="steam-particle steam-1"></span>
        <span class="steam-particle steam-2"></span>
        <span class="steam-particle steam-3"></span>
      </div>

      <!-- Taza de Café Ilustrada -->
      <div class="relative z-10 w-24 h-24 rounded-3xl bg-gradient-to-tr from-amber-600 via-amber-500 to-amber-400 p-0.5 shadow-2xl shadow-amber-500/30 flex items-center justify-center">
        <div class="w-full h-full rounded-[22px] bg-white flex items-center justify-center">
          <i class="pi pi-coffee text-4xl text-amber-500 animate-bounce"></i>
        </div>
      </div>
    </div>

    <!-- Título y Subtítulo -->
    <div class="space-y-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 border border-amber-300 text-amber-900 text-[11px] font-bold tracking-wider uppercase">
        <i class="pi pi-sparkles text-amber-600"></i>
        <span>Cafetería & Repostería Gourmet</span>
      </div>

      <h1 class="text-4xl sm:text-5xl font-black text-stone-900 tracking-tight">
        Taza<span class="text-amber-500">Norte</span>
      </h1>

      <p class="text-xs sm:text-sm text-stone-600 font-medium max-w-xs mx-auto">
        Sistema Web Transaccional y Control de Acceso RBAC
      </p>
    </div>

    <!-- Barra de Progreso y Estado -->
    <div class="w-full max-w-xs space-y-2 pt-4">
      <div class="flex justify-between text-[11px] font-mono text-stone-600 font-semibold">
        <span>{{ statusText() }}</span>
        <span class="text-amber-700">{{ progress() }}%</span>
      </div>

      <!-- Barra -->
      <div class="w-full h-2 rounded-full bg-amber-200/60 overflow-hidden shadow-inner p-0.5 border border-amber-300/40">
        <div class="h-full rounded-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 transition-all duration-150 ease-out shadow-sm"
             [style.width.%]="progress()"></div>
      </div>
    </div>

    <!-- Badge Institucional -->
    <div class="pt-6 border-t border-amber-200/60 w-full flex items-center justify-center gap-2 text-[11px] text-stone-500 font-medium">
      <i class="pi pi-verified text-amber-600"></i>
      <span>Bases de Datos II · Universidad de La Guajira</span>
    </div>

  </div>

</div>

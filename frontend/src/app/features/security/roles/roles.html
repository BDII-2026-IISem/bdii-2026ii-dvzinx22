<div class="space-y-6">
  <!-- Cabecera Limpia Estilo HornoRaíz -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 py-2">
    <div>
      <h1 class="text-3xl font-extrabold text-stone-900 tracking-tight font-serif">
        Roles
      </h1>
      <p class="text-xs sm:text-sm text-stone-600 mt-1">
        Agrupan concesiones. La baja es lógica.
      </p>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-xs font-mono font-medium text-stone-500">
        {{ filteredRoles().length }} roles
      </span>
      <button (click)="openNewRole()" 
              class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-md shadow-amber-600/20 flex items-center gap-2 cursor-pointer transition-all hover:scale-[1.02]">
        <i class="pi pi-plus text-xs"></i>
        <span>Nuevo rol</span>
      </button>
      <button (click)="loadRoles()" 
              title="Refrescar"
              class="w-8 h-8 rounded-xl border border-stone-200 bg-white hover:bg-stone-50 text-stone-600 flex items-center justify-center cursor-pointer shadow-xs">
        <i class="pi pi-refresh text-xs" [class.pi-spin]="loading()"></i>
      </button>
    </div>
  </div>

  <!-- Tarjeta Blanca de Roles: Buscador + Tabla -->
  <div class="bg-white rounded-2xl border border-stone-200/90 p-5 shadow-sm space-y-4">
    
    <!-- Barra de Búsqueda -->
    <div class="relative w-full max-w-md">
      <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
      <input type="text"
             [value]="searchTerm()"
             (input)="searchTerm.set($any($event.target).value)"
             placeholder="Buscar por nombre o descripción..."
             class="w-full pl-9 pr-4 py-2 bg-stone-50/70 border border-stone-200 rounded-xl text-xs text-stone-900 placeholder-stone-400 focus:outline-none focus:border-amber-500 focus:bg-white transition-all" />
    </div>

    <!-- Tabla de Roles -->
    <div class="overflow-x-auto border border-stone-200 rounded-xl">
      <p-table [value]="filteredRoles()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
        <ng-template #header pTemplate="header">
          <tr class="border-b border-stone-200 text-stone-700 text-xs uppercase bg-[#FDFBF7]">
            <th class="p-3 font-bold" pSortableColumn="name">
              Rol <i class="pi pi-sort-alt text-[10px] text-stone-400 ml-1"></i>
            </th>
            <th class="p-3 font-bold" pSortableColumn="description">
              Descripción <i class="pi pi-sort-alt text-[10px] text-stone-400 ml-1"></i>
            </th>
            <th class="p-3 font-bold text-center">Estado</th>
            <th class="p-3 font-bold text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template #body pTemplate="body" let-role>
          <tr class="border-b border-stone-100 hover:bg-amber-50/25 transition-colors text-xs text-stone-800">
            <td class="p-3 font-mono font-bold text-stone-900 flex items-center gap-2">
              <i class="pi pi-id-card text-amber-600 text-sm"></i>
              <span>{{ role.name }}</span>
              <span class="text-[10px] text-stone-400 font-mono">#{{ role.id }}</span>
            </td>
            <td class="p-3 text-stone-600">{{ role.description || 'Sin descripción' }}</td>
            <td class="p-3 text-center">
              <span [class]="role.status === 'active' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'"
                    class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold border inline-block">
                {{ role.status === 'active' ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-2">
                <button (click)="editRole(role)" 
                        title="Editar rol" 
                        class="p-1 text-stone-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors cursor-pointer">
                  <i class="pi pi-pencil text-xs"></i>
                </button>
                <button (click)="toggleRoleStatus(role)" 
                        [title]="role.status === 'active' ? 'Desactivar rol' : 'Reactivar rol'" 
                        [class]="role.status === 'active' ? 'text-stone-400 hover:text-rose-600 hover:bg-rose-50' : 'text-emerald-600 hover:bg-emerald-50'"
                        class="p-1 rounded-lg transition-colors cursor-pointer">
                  <i [class]="role.status === 'active' ? 'pi pi-ban' : 'pi pi-check'" class="text-xs"></i>
                </button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="p-6 text-center text-stone-400 text-xs">
              No se encontraron roles registrados.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

  </div>

  <!-- Diálogo Crear/Editar Rol -->
  <p-dialog [visible]="roleDialog()" 
            (visibleChange)="roleDialog.set($event)"
            [modal]="true" 
            [draggable]="false" 
            [resizable]="false" 
            [header]="isEditing() ? 'Editar Rol' : 'Nuevo Rol'" 
            [style]="{ width: '450px' }">
    <form [formGroup]="roleForm" (ngSubmit)="saveRole()" class="space-y-4 pt-2">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider">Nombre del Rol *</label>
        <input type="text" 
               formControlName="name" 
               class="w-full bg-stone-50/70 border border-stone-200 text-stone-900 rounded-xl px-3 py-2 text-xs focus:border-amber-500 focus:bg-white outline-none" 
               placeholder="ej: supervisor, cajero" />
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider">Descripción</label>
        <textarea formControlName="description" 
                  rows="3" 
                  class="w-full bg-stone-50/70 border border-stone-200 text-stone-900 rounded-xl px-3 py-2 text-xs focus:border-amber-500 focus:bg-white outline-none" 
                  placeholder="Responsabilidades y alcance del rol..."></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-stone-100">
        <button type="button" 
                (click)="roleDialog.set(false)" 
                class="px-4 py-2 rounded-xl border border-stone-200 text-xs font-medium text-stone-600 hover:bg-stone-50 cursor-pointer">
          Cancelar
        </button>
        <button type="submit" 
                [disabled]="roleForm.invalid || loading()"
                class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-md shadow-amber-600/20 disabled:opacity-50 cursor-pointer">
          {{ loading() ? 'Guardando...' : (isEditing() ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </p-dialog>
</div>

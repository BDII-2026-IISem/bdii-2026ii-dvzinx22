<div class="space-y-6">
  <!-- Cabecera del Módulo Estilo HornoRaíz -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 py-2">
    <div>
      <h1 class="text-3xl font-extrabold text-stone-900 tracking-tight font-serif flex items-center gap-2">
        <i class="pi pi-tags text-amber-600"></i>
        <span>Tipos de Producto (Categorías)</span>
      </h1>
      <p class="text-xs sm:text-sm text-stone-600 mt-1">
        Clasificación de menú de TazaNorte consumiendo /api/product-types/
      </p>
    </div>

    <div class="flex items-center gap-3">
      <button (click)="openNew()"
              class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-md shadow-amber-600/20 flex items-center gap-2 cursor-pointer transition-all hover:scale-[1.02]">
        <i class="pi pi-plus text-xs"></i>
        <span>Nueva Categoría</span>
      </button>
      <button (click)="loadProductTypes()"
              title="Refrescar"
              class="w-8 h-8 rounded-xl border border-stone-200 bg-white hover:bg-stone-50 text-stone-600 flex items-center justify-center cursor-pointer shadow-xs">
        <i class="pi pi-refresh text-xs" [class.pi-spin]="loading()"></i>
      </button>
    </div>
  </div>

  <!-- Tarjeta Blanca de Tipos -->
  <div class="bg-white rounded-2xl border border-stone-200/90 p-5 shadow-sm space-y-4">
    <div class="overflow-x-auto border border-stone-200 rounded-xl">
      <p-table [value]="productTypes()" 
               [loading]="loading()"
               [paginator]="true" 
               [rows]="10" 
               [rowsPerPageOptions]="[5, 10, 20]"
               responsiveLayout="scroll"
               styleClass="p-datatable-sm">
        
        <ng-template #header pTemplate="header">
          <tr class="border-b border-stone-200 text-stone-700 text-xs uppercase bg-[#FDFBF7]">
            <th class="p-3 font-bold">ID</th>
            <th class="p-3 font-bold">Nombre de Categoría</th>
            <th class="p-3 font-bold">Descripción</th>
            <th class="p-3 font-bold text-center">Estado</th>
            <th class="p-3 font-bold text-center">Acciones</th>
          </tr>
        </ng-template>

        <ng-template #body let-type pTemplate="body">
          <tr class="border-b border-stone-100 hover:bg-amber-50/25 transition-colors text-xs text-stone-800">
            <td class="p-3 font-mono font-bold text-amber-800">
              #{{ type.id }}
            </td>
            <td class="p-3 font-bold text-stone-900 text-sm">
              {{ type.name }}
            </td>
            <td class="p-3 text-stone-700 font-medium">
              {{ type.description || 'Sin descripción' }}
            </td>
            <td class="p-3 text-center">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                Activo
              </span>
            </td>
            <td class="p-3 text-center">
              <div class="inline-flex items-center justify-center gap-2">
                <button (click)="editType(type)" 
                        title="Editar"
                        class="p-1 text-stone-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors cursor-pointer">
                  <i class="pi pi-pencil text-xs"></i>
                </button>
                <button (click)="deleteType(type)" 
                        title="Eliminar"
                        class="p-1 text-stone-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer">
                  <i class="pi pi-trash text-xs"></i>
                </button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template #emptymessage pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="p-8 text-center text-stone-400 text-xs">
              <i class="pi pi-inbox text-3xl mb-2 block text-stone-300"></i>
              No se encontraron tipos de producto registrados.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<!-- Modal Formulario Reactivo Crear / Editar Tipo -->
<p-dialog [(visible)]="dialogVisible" 
          [modal]="true" 
          [header]="isEditing() ? 'Editar Categoría' : 'Nueva Categoría de Menú'"
          [style]="{ width: '450px' }">
  
  <form [formGroup]="typeForm" (ngSubmit)="saveType()" class="space-y-4 pt-2">
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider">Nombre de la Categoría *</label>
      <input type="text" 
             pInputText 
             formControlName="name" 
             class="w-full bg-stone-50/70 border border-stone-200 text-stone-900 rounded-xl px-3 py-2 text-xs focus:border-amber-500 focus:bg-white outline-none"
             placeholder="Ej: Repostería Fina" />
    </div>

    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider">Descripción (Opcional)</label>
      <input type="text" 
             pInputText 
             formControlName="description" 
             class="w-full bg-stone-50/70 border border-stone-200 text-stone-900 rounded-xl px-3 py-2 text-xs focus:border-amber-500 focus:bg-white outline-none"
             placeholder="Ej: Postres artesanales y repostería horneada" />
    </div>

    <div class="flex items-center justify-end gap-2 pt-4 border-t border-stone-100">
      <button type="button" 
              (click)="dialogVisible.set(false)" 
              class="px-4 py-2 rounded-xl border border-stone-200 text-xs font-medium text-stone-600 hover:bg-stone-50 cursor-pointer">
        Cancelar
      </button>
      <button type="submit" 
              class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-md shadow-amber-600/20 cursor-pointer">
        {{ isEditing() ? 'Actualizar' : 'Guardar Categoría' }}
      </button>
    </div>
  </form>
</p-dialog>

<!-- Pantalla de Bienvenida y Animación Inicial -->
@if (showSplash()) {
  <app-splash (completed)="onSplashComplete()" />
}

<div class="min-h-screen bg-[#FAF8F5] text-stone-900 flex flex-col font-sans selection:bg-amber-500 selection:text-white">
  <p-toast position="top-right" />
  <p-confirmdialog />
  
  <!-- Header Superior -->
  <app-navbar />

  <!-- Contenedor Principal: Sidebar Izquierda + Contenido Central -->
  <div class="flex-1 flex flex-col md:flex-row w-full">
    <!-- Menú Lateral -->
    <app-sidebar />

    <!-- Área de Vistas -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 max-w-full overflow-x-hidden">
      <router-outlet />
    </main>
  </div>

  <!-- Footer Inferior -->
  <footer class="border-t border-amber-200/60 bg-white py-3 text-center text-xs text-stone-500 font-medium">
    TazaNorte &copy; 2026 · Bases de Datos II · Universidad de La Guajira
  </footer>
</div>

<!-- Pantalla de Bienvenida y Animación Inicial -->
@if (showSplash()) {
  <app-splash (completed)="onSplashComplete()" />
}

<div class="min-h-screen bg-[#FAF8F5] text-stone-900 flex flex-col font-sans selection:bg-amber-500 selection:text-white">
  <p-toast position="top-right" />
  <p-confirmdialog />
  
  <!-- Header Superior -->
  <app-navbar [isLogin]="isLoginRoute()" />

  @if (isLoginRoute()) {
    <!-- Vista Centrada de Login sin Sidebar -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 bg-gradient-to-b from-[#FAF8F5] via-[#F4EFE6] to-[#FAF8F5] min-h-[calc(100vh-4rem-2.5rem)]">
      <router-outlet />
    </main>
  } @else {
    <!-- Contenedor Principal: Sidebar Izquierda Estilo HornoRaíz + Área de Contenido -->
    <div class="flex-1 flex flex-col md:flex-row w-full min-h-[calc(100vh-4rem-2.5rem)]">
      <!-- Menú Lateral Oscuro Estilo HornoRaíz -->
      <app-sidebar />

      <!-- Área de Vistas con Fondo Crema Cálido Gourmet -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 max-w-full overflow-x-hidden bg-[#FAF8F5]">
        <router-outlet />
      </main>
    </div>
  }

  <!-- Footer Inferior -->
  <footer class="border-t border-amber-200/60 bg-white py-3 text-center text-xs text-stone-500 font-medium">
    TazaNorte &copy; 2026 · Bases de Datos II · Universidad de La Guajira
  </footer>
</div>
